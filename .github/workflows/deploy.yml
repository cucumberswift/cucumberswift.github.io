name: Deploy

# Deploys site/ to GitHub Pages. site/ is published to this repository from
# elsewhere, so do not edit it here.
#
# Adds the documentation of CucumberSwift and CucumberSwiftExpressions from their
# release assets (scripts/add-docs.sh). A release in another repository cannot
# start this workflow with GITHUB_TOKEN, so it also runs every hour, and deploys
# only when the published versions changed. After a release, run it by hand to
# publish at once.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.changed.outputs.changed }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check site/
        run: |
          if [ ! -f site/index.html ]; then
            echo "::error::site/index.html is missing. Publish the website first."
            exit 1
          fi
          # These paths belong to the documentation and to redirects from old URLs.
          status=0
          for reserved in help docs CucumberSwift CucumberSwiftExpressions documentation tutorials sitemap.xml robots.txt; do
            if [ -e "site/$reserved" ]; then
              echo "::error::site/$reserved is reserved for the documentation."
              status=1
            fi
          done
          exit $status

      - name: Build
        run: |
          mkdir _site
          cp -R site/. _site/

      # Reads the public releases of both packages. The token only raises the API rate limit.
      - name: Add documentation
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/add-docs.sh _site

      # A scheduled run deploys only if the published versions differ from the live site.
      - name: Check for changes
        id: changed
        env:
          EVENT: ${{ github.event_name }}
        run: |
          changed=true
          if [ "$EVENT" = schedule ] &&
             live=$(curl -sf --max-time 30 https://cucumberswift.org/help/versions.json) &&
             [ "$(jq -S . <<< "$live")" = "$(jq -S . _site/help/versions.json)" ]; then
            changed=false
            echo "The published versions are unchanged. Nothing to deploy."
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Upload
        if: steps.changed.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
