name: Deploy

# Deploys site/ to GitHub Pages. site/ is published to this repository from
# elsewhere, so do not edit it here.
#
# The documentation is not deployed here: each package publishes its own to its
# own Pages site, /CucumberSwift/ and /CucumberSwiftExpressions/. This site adds
# redirects from the old documentation URLs (scripts/add-redirects.sh).

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
      - 'redirects/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check site/
        run: |
          if [ ! -f site/index.html ]; then
            echo "::error::site/index.html is missing. Publish the website first."
            exit 1
          fi
          # These paths belong to the documentation and to redirects from old URLs.
          status=0
          for reserved in help docs CucumberSwift CucumberSwiftExpressions documentation tutorials sitemap.xml robots.txt; do
            if [ -e "site/$reserved" ]; then
              echo "::error::site/$reserved is reserved for the documentation."
              status=1
            fi
          done
          exit $status

      - name: Build
        run: |
          mkdir _site
          cp -R site/. _site/

      # Reads the packages' public versions.json. Calls no GitHub API.
      - name: Add redirects from the old documentation URLs
        run: scripts/add-redirects.sh _site

      - name: Upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
